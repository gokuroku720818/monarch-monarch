name: Release V176 recycled-slot UI cleanup
on:
  push:
    paths:
      - 'scripts/upgrade_v176.py'
      - 'tests/test_recycled_slot_cleanup.js'
      - '.github/workflows/upgrade-v176.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate V176 from exact V175 Git blob
        run: python3 scripts/upgrade_v176.py
      - name: Verify original assets, selection cleanup and JavaScript syntax
        run: |
          python3 tests/test_original_parity.py index.html
          python3 tests/test_original_parity.py monarch_v176_lite.html
          node tests/test_recycled_slot_cleanup.js index.html
          node tests/test_touch_focus_adapter.js index.html
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          a=pathlib.Path('index.html').read_bytes()
          b=pathlib.Path('monarch_v176_lite.html').read_bytes()
          assert a==b and b'Original Restoration V176 LITE' in a
          assert b'monarch-original-midi.js' not in a
          scripts=[m.group(1) for m in re.finditer(r'<script\b[^>]*>(.*?)</script\s*>',a.decode('utf8'),re.I|re.S) if m.group(1).strip()]
          with tempfile.TemporaryDirectory() as d:
              for i,s in enumerate(scripts):
                  p=pathlib.Path(d)/f'game_{i}.js';p.write_text(s)
                  subprocess.run(['node','--check',str(p)],check=True)
          print(f'PASS V176 GitHub index/release byte parity and {len(scripts)} JavaScript blocks')
          PY
          if ! git diff --quiet -- index.html || [ ! -f monarch_v176_lite.html ] || [ -n "$(git ls-files --others --exclude-standard monarch_v176_lite.html)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html monarch_v176_lite.html
            git commit -m 'Release V176: clear obsolete commands on unit slot recycle'
            git push
          else
            echo 'V176 already current'
          fi
