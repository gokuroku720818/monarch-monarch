name: Diagnose V204 neutral parity
on:
  push:
    branches:
      - restore/v204-neutral-native-flags
    paths:
      - '.github/workflows/diagnose-v204.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print neutral/route snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=[
            'planOriginalNeutralSpecial',
            'trackedUnitRoute',
            'neutralCounter',
            "type==='king'",
            'originalFrameFlags',
            'actionCode===3',
            'unitWord'
          ]
          for n in needles:
              print('\n===== ',n,' =====')
              pos=0;count=0
              while True:
                  i=s.find(n,pos)
                  if i<0 or count>=20: break
                  print(s[max(0,i-700):min(len(s),i+1500)].replace('\n',' '))
                  print('\n---')
                  pos=i+len(n);count+=1
              print('COUNT',count)
          PY
