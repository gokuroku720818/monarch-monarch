name: Probe V204 neutral counter parity
on:
  push:
    branches: [restore/v204-neutral-native-flags]
    paths:
      - 'scripts/upgrade_v204.py'
      - 'tests/test_v204_neutral_counter_browser.py'
      - '.github/workflows/probe-v204.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate candidate
        run: python3 scripts/upgrade_v204.py monarch_v203_lite.html /tmp/v204.html
      - name: RED GREEN
        run: python3 tests/test_v204_neutral_counter_browser.py monarch_v203_lite.html /tmp/v204.html
      - name: Candidate blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('/tmp/v204.html').read_bytes()
          print(hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest())
          PY
