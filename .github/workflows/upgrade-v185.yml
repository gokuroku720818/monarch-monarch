name: Verify and stage V185 final-strength base continuation
on:
  push:
    branches:
      - restore/v185-base-continue
    paths:
      - 'parity/original-parity.json'
      - 'scripts/upgrade_v185.py'
      - 'tests/test_base_continue_last_strength.js'
      - 'tests/test_base_continue_browser.py'
      - 'tests/test_v185_asset_stability.py'
      - '.github/workflows/upgrade-v185.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-v185:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate V185 from exact V184 Git blob
        run: python3 scripts/upgrade_v185.py
      - name: Verify parity manifest and original resources
        run: |
          python3 tests/test_parity_manifest.py
          python3 tools/audit_parity.py index.html
          python3 tests/test_original_parity.py index.html
          python3 tests/test_original_parity.py monarch_v185_lite.html
      - name: Verify V185 final-strength regression and prior focused regressions
        run: |
          node tests/test_base_continue_last_strength.js index.html
          node tests/test_base_continue_last_strength.js monarch_v185_lite.html
          node tests/test_fence_exact_target_height.js index.html
          node tests/test_bridge_command_validity.js index.html
          node tests/test_fence_command_validity.js index.html
          node tests/test_work_height.js index.html
          node tests/test_command_pause.js index.html
          node tests/test_fence_order_height.js index.html
          node tests/test_bridge_deck_height.js index.html
          node tests/test_king_defeat_cleanup.js index.html
          node tests/test_recycled_slot_cleanup.js index.html
          node tests/test_touch_focus_adapter.js index.html
      - name: Verify V185 assets, browser continuation, and 75-stage invariants
        run: |
          python3 tests/test_v185_asset_stability.py monarch_v184_lite.html monarch_v185_lite.html
          python3 tests/test_base_continue_browser.py monarch_v185_lite.html
          python3 tests/test_stage_invariants.py monarch_v185_lite.html
      - name: Verify JavaScript syntax and archive identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,tempfile
          a=Path('index.html').read_bytes()
          b=Path('monarch_v185_lite.html').read_bytes()
          assert a==b and b'Original Restoration V185 LITE' in a
          blocks=[m.group(1) for m in re.finditer(r'<script\b[^>]*>(.*?)</script\s*>',a.decode('utf8'),re.I|re.S) if m.group(1).strip()]
          with tempfile.TemporaryDirectory() as td:
              for i,js in enumerate(blocks):
                  f=Path(td)/f'script_{i}.js'; f.write_text(js)
                  subprocess.run(['node','--check',str(f)],check=True)
          print('PASS V185 archive identity; JS blocks',len(blocks))
          print('SHA256',hashlib.sha256(a).hexdigest())
          PY
      - name: Commit tested V185 to parity branch
        run: |
          if ! git diff --quiet -- index.html || [ -n "$(git ls-files --others --exclude-standard monarch_v185_lite.html)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html monarch_v185_lite.html
            git commit -m 'Stage V185: allow final-strength continued base build'
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo 'V185 already staged'
          fi
