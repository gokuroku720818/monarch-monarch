name: Probe V205 CPU dying-target parity
on:
  push:
    branches: [restore/v205-cpu-dying-target]
    paths:
      - 'scripts/upgrade_v205.py'
      - 'tests/test_v205_enemy_dying_target_browser.py'
      - '.github/workflows/probe-v205.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate candidate
        run: python3 scripts/upgrade_v205.py monarch_v204_lite.html /tmp/v205.html
      - name: RED GREEN
        run: python3 tests/test_v205_enemy_dying_target_browser.py monarch_v204_lite.html /tmp/v205.html
      - name: Candidate blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('/tmp/v205.html').read_bytes()
          print('TARGET',hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest())
          PY
