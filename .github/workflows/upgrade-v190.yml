name: Verify and stage V190 native elevator pathing
on:
  push:
    branches:
      - restore/v190-elevator-pathing
    paths:
      - 'parity/original-parity.json'
      - 'scripts/upgrade_v190.py'
      - 'tests/test_elevator_red_green_browser.py'
      - 'tests/test_elevator_stage_invariants.py'
      - 'tests/test_v190_asset_stability.py'
      - 'V190_ORIGINAL_COMPARISON_REPORT.md'
      - '.github/workflows/upgrade-v190.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-v190:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate V190 from exact V189 Git blob
        run: python3 scripts/upgrade_v190.py
      - name: Verify parity manifest and original resources
        run: |
          python3 tests/test_parity_manifest.py
          python3 tools/audit_parity.py index.html
          python3 tests/test_original_parity.py index.html
          python3 tests/test_original_parity.py monarch_v190_lite.html
      - name: Verify V190 elevator RED/GREEN and retained focused regressions
        run: |
          python3 tests/test_elevator_red_green_browser.py monarch_v189_lite.html monarch_v190_lite.html
          node tests/test_route_tie_backtrack.js monarch_v189_lite.html
          node tests/test_fence_finish_same_pass.js index.html
          node tests/test_destroybase_continue_excludes_own.js index.html
          node tests/test_base_continue_funding_wait.js index.html
          node tests/test_base_continue_last_strength.js index.html
          node tests/test_fence_exact_target_height.js index.html
          node tests/test_bridge_command_validity.js index.html
          node tests/test_fence_command_validity.js index.html
          node tests/test_work_height.js index.html
          node tests/test_command_pause.js index.html
          node tests/test_fence_order_height.js index.html
          node tests/test_bridge_deck_height.js index.html
          node tests/test_king_defeat_cleanup.js index.html
          node tests/test_recycled_slot_cleanup.js index.html
          node tests/test_touch_focus_adapter.js index.html
      - name: Verify browser regressions and 75-stage invariants
        run: |
          python3 tests/test_route_tie_backtrack_browser.py monarch_v190_lite.html
          python3 tests/test_fence_finish_same_pass_browser.py monarch_v190_lite.html
          python3 tests/test_destroybase_continue_browser.py monarch_v190_lite.html
          python3 tests/test_stage_invariants.py monarch_v190_lite.html
          python3 tests/test_elevator_stage_invariants.py monarch_v190_lite.html
      - name: Verify exact V189 to V190 asset stability
        run: python3 tests/test_v190_asset_stability.py monarch_v189_lite.html monarch_v190_lite.html
      - name: Verify JavaScript syntax, archive identity, and exact target blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,tempfile
          a=Path('index.html').read_bytes()
          b=Path('monarch_v190_lite.html').read_bytes()
          assert a==b and b'Original Restoration V190 LITE' in a
          git=hashlib.sha1(b'blob '+str(len(a)).encode()+b'\0'+a).hexdigest()
          assert git=='101c44bbd5ca45ea805bfb344c9aae03adba5401',git
          blocks=[m.group(1) for m in re.finditer(r'<script\b[^>]*>(.*?)</script\s*>',a.decode('utf8'),re.I|re.S) if m.group(1).strip()]
          with tempfile.TemporaryDirectory() as td:
              for i,js in enumerate(blocks):
                  f=Path(td)/f'script_{i}.js'; f.write_text(js)
                  subprocess.run(['node','--check',str(f)],check=True)
          print('PASS V190 archive identity; JS blocks',len(blocks))
          print('Git blob',git)
          print('SHA256',hashlib.sha256(a).hexdigest())
          PY
      - name: Commit tested V190 to parity branch
        run: |
          if ! git diff --quiet -- index.html || [ -n "$(git ls-files --others --exclude-standard monarch_v190_lite.html)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html monarch_v190_lite.html
            git commit -m 'Stage V190: restore native elevator pathing'
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo 'V190 already staged'
          fi
