name: Release V180 command pause
on:
  push:
    paths:
      - 'scripts/upgrade_v180.py'
      - 'tests/test_command_pause.js'
      - '.github/workflows/upgrade-v180.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate V180 only from exact V179 Git blob
        run: python3 scripts/upgrade_v180.py
      - name: Verify original resources and previous gameplay regressions
        run: |
          python3 tests/test_original_parity.py index.html
          python3 tests/test_original_parity.py monarch_v180_lite.html
          node tests/test_command_pause.js index.html
          node tests/test_command_pause.js monarch_v180_lite.html
          node tests/test_fence_order_height.js index.html
          node tests/test_bridge_deck_height.js index.html
          node tests/test_king_defeat_cleanup.js index.html
          node tests/test_recycled_slot_cleanup.js index.html
          node tests/test_touch_focus_adapter.js index.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib
          a=Path('index.html').read_bytes()
          b=Path('monarch_v180_lite.html').read_bytes()
          assert a==b and b'Original Restoration V180 LITE' in a
          assert b'monarch-original-midi.js' not in a
          stages=re.findall(rb'^const STAGES=(.*);$',a,re.M)
          wavs=re.findall(rb'^const SOUND_DATA=(.*);$',a,re.M)
          assert len(stages)==1 and len(wavs)==1
          blocks=[m.group(1) for m in re.finditer(r'<script\b[^>]*>(.*?)</script\s*>',a.decode('utf8'),re.I|re.S) if m.group(1).strip()]
          with tempfile.TemporaryDirectory() as td:
            for i,js in enumerate(blocks):
              f=Path(td)/f'script_{i}.js';f.write_text(js)
              subprocess.run(['node','--check',str(f)],check=True)
          print(f'PASS V180 index/release parity and {len(blocks)} JavaScript blocks')
          PY
      - name: Publish tested game and archived V180 release
        run: |
          if ! git diff --quiet -- index.html || [ -n "$(git ls-files --others --exclude-standard monarch_v180_lite.html)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html monarch_v180_lite.html
            git commit -m 'Release V180: pause simulation during commands'
            git push
          else
            echo 'V180 already released'
          fi
