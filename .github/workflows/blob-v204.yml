name: Compute V204 candidate blob
on:
  push:
    branches: [restore/v204-neutral-native-flags]
    paths: ['.github/workflows/blob-v204.yml']
permissions:
  contents: read
jobs:
  blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/upgrade_v204.py monarch_v203_lite.html /tmp/v204.html
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('/tmp/v204.html').read_bytes()
          print('TARGET',hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest())
          PY
