name: Verify and stage V204 neutral active-step counter parity
on:
  push:
    branches:
      - restore/v204-neutral-native-flags
    paths:
      - 'parity/original-parity.json'
      - 'scripts/upgrade_v204.py'
      - 'tests/test_v204_neutral_counter_browser.py'
      - 'tests/test_v204_asset_stability.py'
      - 'V204_ORIGINAL_COMPARISON_REPORT.md'
      - '.github/workflows/upgrade-v204.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-v204:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate V204 from exact V203 Git blob
        run: python3 scripts/upgrade_v204.py
      - name: Verify parity and resources
        run: |
          python3 tests/test_parity_manifest.py
          python3 tools/audit_parity.py index.html
          python3 tests/test_original_parity.py index.html
          python3 tests/test_original_parity.py monarch_v204_lite.html
      - name: Verify V204 neutral AI and retained AI/combat regressions
        run: |
          python3 tests/test_v204_neutral_counter_browser.py monarch_v203_lite.html monarch_v204_lite.html
          python3 tests/test_v203_neutral_dying_target_browser.py monarch_v202_lite.html monarch_v204_lite.html
          python3 tests/test_v202_neutral_hunt_browser.py monarch_v201_lite.html monarch_v204_lite.html
          python3 tests/test_v201_ai_commander_block_browser.py monarch_v200_lite.html monarch_v204_lite.html
          python3 tests/test_v200_enemy_ai_commander_browser.py monarch_v199_lite.html monarch_v204_lite.html
          python3 tests/test_v199_friendly_ai_actionword_browser.py monarch_v198_lite.html monarch_v204_lite.html
          python3 tests/test_v198_zero_counter_browser.py monarch_v197_lite.html monarch_v204_lite.html
          python3 tests/test_v197_merge_commander_bit_browser.py monarch_v196_lite.html monarch_v204_lite.html
          python3 tests/test_v196_dying_contact_browser.py monarch_v195_lite.html monarch_v204_lite.html
          python3 tests/test_v195_commander_bit_browser.py monarch_v194_lite.html monarch_v204_lite.html
          python3 tests/test_v194_combat_sfx_browser.py monarch_v193_lite.html monarch_v204_lite.html
          python3 tests/test_v193_actionword_combat_browser.py monarch_v192_lite.html monarch_v204_lite.html
          python3 tests/test_v192_combat_browser.py monarch_v191_lite.html monarch_v204_lite.html
      - name: Verify retained movement and work regressions
        run: |
          python3 tests/test_v191_radius_browser.py monarch_v190_lite.html monarch_v191_lite.html
          python3 tests/test_route_tie_backtrack_browser.py monarch_v204_lite.html
          python3 tests/test_elevator_runtime_browser.py monarch_v204_lite.html
          python3 tests/test_fence_finish_same_pass_browser.py monarch_v204_lite.html
          python3 tests/test_destroybase_continue_browser.py monarch_v204_lite.html
          node tests/test_fence_finish_same_pass.js index.html
          node tests/test_destroybase_continue_excludes_own.js index.html
          node tests/test_base_continue_funding_wait.js index.html
          node tests/test_base_continue_last_strength.js index.html
          node tests/test_fence_exact_target_height.js index.html
          node tests/test_bridge_command_validity.js index.html
          node tests/test_fence_command_validity.js index.html
          node tests/test_work_height.js index.html
          node tests/test_command_pause.js index.html
          node tests/test_fence_order_height.js index.html
          node tests/test_bridge_deck_height.js index.html
          node tests/test_king_defeat_cleanup.js index.html
          node tests/test_recycled_slot_cleanup.js index.html
          node tests/test_touch_focus_adapter.js index.html
      - name: Verify 75-stage invariants
        run: |
          python3 tests/test_stage_invariants.py monarch_v204_lite.html
          python3 tests/test_elevator_stage_invariants.py monarch_v204_lite.html
      - name: Verify exact V203 to V204 asset stability
        run: python3 tests/test_v204_asset_stability.py monarch_v203_lite.html monarch_v204_lite.html
      - name: Verify JavaScript, archive identity, and target blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,tempfile
          a=Path('index.html').read_bytes(); b=Path('monarch_v204_lite.html').read_bytes()
          assert a==b and b'Original Restoration V204 LITE' in a
          git=hashlib.sha1(b'blob '+str(len(a)).encode()+b'\0'+a).hexdigest()
          assert git=='db3b87755bc7c39faa6a90437d49290bfa79ae62',git
          blocks=[m.group(1) for m in re.finditer(r'<script\b[^>]*>(.*?)</script\s*>',a.decode('utf8'),re.I|re.S) if m.group(1).strip()]
          with tempfile.TemporaryDirectory() as td:
              for i,js in enumerate(blocks):
                  f=Path(td)/f'script_{i}.js'; f.write_text(js); subprocess.run(['node','--check',str(f)],check=True)
          print('PASS V204 archive identity; JS blocks',len(blocks),'Git blob',git,'SHA256',hashlib.sha256(a).hexdigest())
          PY
      - name: Commit tested V204 to parity branch
        run: |
          if ! git diff --quiet -- index.html || [ -n "$(git ls-files --others --exclude-standard monarch_v204_lite.html)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html monarch_v204_lite.html
            git commit -m 'Stage V204: keep neutral counter stable during active movement'
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo 'V204 already staged'
          fi
