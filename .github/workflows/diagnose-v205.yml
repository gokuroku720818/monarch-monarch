name: Diagnose V205 CPU target parity
on:
  push:
    branches: [restore/v205-cpu-dying-target]
    paths: ['.github/workflows/diagnose-v205.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print CPU AI snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=[
            'function findEnemyUnitTarget',
            'function findFriendlyMergeTarget',
            'function buildOriginalAiBlockSet',
            'function planOriginalIdle',
            'if(!v||!v.alive',
            'v.dying',
            'originalFrameFlags'
          ]
          for n in needles:
              print('\n===== '+n+' =====')
              pos=0;count=0
              while True:
                  i=s.find(n,pos)
                  if i<0 or count>=12: break
                  print(s[max(0,i-500):min(len(s),i+3500)].replace('\n',' '))
                  print('\n---')
                  pos=i+len(n);count+=1
              print('COUNT',count)
          PY
